# Truy cập app từ điện thoại qua Tailscale — chỉ đường hầm chạy trong Docker, app vẫn chạy trên Mac
# (render/whisper/ffmpeg/Chrome/nlm cần máy thật). Chỉ thiết bị trong tailnet của bạn vào được.
#   docker compose -f deploy/tailscale/docker-compose.yml up -d      # bật
#   docker compose -f deploy/tailscale/docker-compose.yml logs -f    # lần đầu: mở link đăng nhập in ra
#   docker compose -f deploy/tailscale/docker-compose.yml down -v    # gỡ sạch (xoá cả phiên đăng nhập)
# Địa chỉ: https://podcast-studio.<tailnet>.ts.net  (KHÔNG bật Funnel — app chưa có đăng nhập)
services:
  tailscale:
    image: tailscale/tailscale:v1.80.3
    container_name: podcast-studio-ts
    hostname: podcast-studio
    restart: unless-stopped
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
volumes:
  ts-state:
