services:
  podcast:
    build: .
    image: podcast-builder:latest
    volumes:
      - ./samples:/app/samples:ro
      - ./script.txt:/app/script.txt:ro
      - ./output:/app/output
      - ./models:/app/models

  # GPU variant — requires an NVIDIA host with nvidia-container-toolkit.
  # For best perf swap the FROM line in Dockerfile to a CUDA base image
  # (e.g. nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04) and add python3.11 +
  # pip via apt before installing requirements.
  podcast-gpu:
    extends: podcast
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
